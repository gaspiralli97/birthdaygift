[project]
name = "birthdaygift"
version = "2.0.0"
description = "Generate a personal, animated birthday card page from a few details. The link expires after five days."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "jinja2==3.1.6",
    "sqlalchemy==2.1.6",
    "alembic==1.20.1",
    "pydantic>=2.13,<2.14",
    "pydantic-settings==2.16.1",
    "aiogram==3.31.0",
    "pillow==13.0.0",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
# Only needed if TEXT_PROVIDER is switched away from the built-in templates.
ai = ["anthropic==2.3.0"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.1",
    "httpx==0.28.1",
    "ruff==0.17.3",
    "mypy==2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/birthdaygift"]

# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "RUF",       # ruff-specific
    "ASYNC",     # async correctness
    "S",         # bandit
    "PTH",       # use pathlib
    "RET",       # return style
    "TID",       # tidy imports
]
ignore = [
    "S101",     # pytest needs assert
    # The copy is Uzbek, Korean and Russian. RUF001-003 read the Uzbek okina
    # and every Cyrillic letter as a suspicious look-alike for ASCII, which is
    # noise here rather than a finding.
    "RUF001",
    "RUF002",
    "RUF003",
    # Relative imports are how this package refers to itself. The rest of the
    # TID family (banned APIs, module-level import bans) stays on.
    "TID252",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # hard-coded test secrets are fine

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["aiogram.*"]
follow_untyped_imports = true

# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
