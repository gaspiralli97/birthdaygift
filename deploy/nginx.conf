# /etc/nginx/sites-available/birthdaygift
#
# HTTP only. `certbot --nginx` rewrites this file in place to add the TLS
# server block and the HTTP->HTTPS redirect, so do not hand-write those here.

server {
    listen 80;
    listen [::]:80;
    server_name 151-145-79-228.sslip.io;

    # Card ids are short and guessable-looking; keep crawlers away entirely.
    location = /robots.txt {
        add_header content-type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    access_log /var/log/nginx/birthdaygift.access.log;
    error_log  /var/log/nginx/birthdaygift.error.log;
}
