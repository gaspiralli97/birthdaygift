# /etc/nginx/sites-available/birthdaygift
#
# Needs this in the http{} block of /etc/nginx/nginx.conf:
#   limit_req_zone $binary_remote_addr zone=cards:10m rate=10r/s;
#
# HTTP only. `certbot --nginx` rewrites this file in place to add the TLS
# server block and the HTTP->HTTPS redirect, so do not hand-write those here.

server {
    listen 80;
    listen [::]:80;
    server_name 151-145-79-228.sslip.io;

    # Card ids are unguessable on their own. A cheap cap means an enumeration
    # attempt is throttled rather than merely improbable, and it costs a real
    # reader nothing.
    limit_req zone=cards burst=20 nodelay;
    limit_req_status 429;

    # Nothing here should ever be indexed: every path but / is a private link.
    location = /robots.txt {
        add_header content-type text/plain;
        return 200 "User-agent: *\nDisallow: /c/\n";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The model takes a while; the bot is waiting on this request.
        proxy_read_timeout 200s;
    }

    access_log /var/log/nginx/birthdaygift.access.log;
    error_log  /var/log/nginx/birthdaygift.error.log;
}
